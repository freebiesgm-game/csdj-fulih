        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500&display=swap');
        .orbitron { font-family: 'Orbitron', monospace; }
        .noto { font-family: 'Noto Sans TC', sans-serif; }

        @keyframes cardIn {
          0% { transform: scale(0.78) translateY(24px); opacity: 0; filter: blur(12px); }
          60% { transform: scale(1.04) translateY(-4px); opacity: 1; filter: blur(0px); }

        @keyframes burst {

          30% { opacity: 0.9; }
          100% { transform: scale(2.8); opacity: 0; }

        @keyframes glowPulse {

          0% { transform: translateY(-100%); }
          100% { transform: translateY(280%); }

          100% { transform: translateY(-120vh) translateX(30px); opacity: 0; }
        }

          0% { transform: translateX(0); }
          100% { transform: translateX(-50%); }

          90% { opacity: 0.6; }

<script>
// 方案B: 主頁背景改為讀外部檔案，方便後期替換
(function(){
  function updateHeroBg(){
    var isMobile = window.innerWidth < 768;
    var heroSrc = isMobile ? "./assets/og-final-1080.png" : "./assets/og-final-1200x630.png";
    document.querySelectorAll('img[alt="背景海報"]').forEach(function(img){
      if(img.getAttribute('src') !== heroSrc){
        img.setAttribute('src', heroSrc);
      }
      // 同時更新 glitch 層的背景
    });
    // glitch 層是 aria-hidden 的兩個同樣圖片
    document.querySelectorAll('img[aria-hidden="true"]').forEach(function(img){
      if(img.src.includes("og-final") || img.src.startsWith("data:")){
        img.setAttribute('src', heroSrc);
      }
    });
  }
  // 初始 + resize
  if(document.readyState !== "loading"){ updateHeroBg(); }
  else { document.addEventListener("DOMContentLoaded", updateHeroBg); }
  window.addEventListener("resize", updateHeroBg);
  // 因為是 React，延遲再執行一次確保覆蓋
  setTimeout(updateHeroBg, 500);
  setTimeout(updateHeroBg, 1500);
})();
</script>
